[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-research"
version = "0.1.0"
description = "Opening Range Breakout research and backtesting tool"
requires-python = ">=3.12"

[project.optional-dependencies]
data     = ["alpaca-py"]
features = ["numpy>=1.24"]
ml       = ["lightgbm>=4.0", "optuna>=3.6"]
qlib     = ["numpy>=1.24", "pandas>=2.0", "pyqlib==0.9.7"]
test     = ["pytest", "numpy>=1.24", "pandas>=2.0", "lightgbm>=4.0", "optuna>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]
