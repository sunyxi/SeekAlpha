name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with test dependencies
        run: pip install -e ".[test]"

      - name: Check AGENT.md exists
        run: test -f AGENT.md || (echo "AGENT.md missing — required by ML discipline contract" && exit 1)

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Verify factor_list.json is frozen
        run: |
          python3 -c "
          import hashlib, sys
          FROZEN = '41788b5b97629965a52799936f691e1bde391801d6df995712cd301df59d80ec'
          with open('src/orb/features/factor_list.json', 'rb') as f:
              actual = hashlib.sha256(f.read()).hexdigest()
          if actual != FROZEN:
              print(f'factor_list.json modified! frozen={FROZEN} actual={actual}', file=sys.stderr)
              sys.exit(1)
          print(f'factor_list.json frozen hash verified: {actual}')
          "

      - name: Validate committed reports
        run: |
          python3 -c "
          import hashlib, json, os, subprocess, sys

          MANIFEST = 'reports/manifest.json'
          if not os.path.exists(MANIFEST):
              print('ERROR: reports/manifest.json missing', file=sys.stderr)
              sys.exit(1)
          try:
              manifest = json.load(open(MANIFEST))
          except json.JSONDecodeError as e:
              print(f'ERROR: manifest.json invalid JSON: {e}', file=sys.stderr)
              sys.exit(1)
          if manifest.get('schema_version') != 1:
              print('ERROR: manifest schema_version != 1', file=sys.stderr)
              sys.exit(1)
          entries = manifest.get('reports', [])
          if not isinstance(entries, list) or not entries:
              print('ERROR: manifest reports list is empty or missing', file=sys.stderr)
              sys.exit(1)
          for e in entries:
              for field in ('filename', 'kind', 'generated_at', 'sha256'):
                  if field not in e:
                      print(f'ERROR: manifest entry missing field {field!r}: {e}', file=sys.stderr)
                      sys.exit(1)

          # Validate wf_select reports that are present on disk (gitignored in CI)
          failed = []
          validated = 0
          for entry in entries:
              path = os.path.join('reports', entry['filename'])
              if not os.path.exists(path):
                  continue  # gitignored in CI — skip
              # SHA-256 integrity check
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(65536), b''):
                      h.update(chunk)
              actual = h.hexdigest()
              if actual != entry['sha256']:
                  print(f'SHA256 MISMATCH {path}: manifest={entry[\"sha256\"]} actual={actual}')
                  failed.append(path)
                  continue
              # Schema validation only for wf_select reports
              if entry['kind'] == 'wf_select':
                  result = subprocess.run(
                      ['python3', 'scripts/validate_report.py', '--report', path],
                      capture_output=True, text=True,
                  )
                  print(result.stdout.strip() or result.stderr.strip())
                  if result.returncode != 0:
                      failed.append(path)
              validated += 1
          if failed:
              print('VALIDATION FAILED:', failed, file=sys.stderr)
              sys.exit(1)
          print(f'manifest.json OK ({len(entries)} entries); {validated} file(s) present and validated.')
          "
