name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with test dependencies
        run: pip install -e ".[test]"

      - name: Check AGENT.md exists
        run: test -f AGENT.md || (echo "AGENT.md missing — required by ML discipline contract" && exit 1)

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate committed reports
        run: |
          python3 -c "
          import glob, subprocess, sys
          reports = glob.glob('reports/*.json')
          failed = []
          for r in sorted(reports):
              result = subprocess.run(
                  ['python3', 'scripts/validate_report.py', '--report', r],
                  capture_output=True, text=True,
              )
              print(result.stdout.strip() or result.stderr.strip())
              if result.returncode != 0:
                  failed.append(r)
          if failed:
              print('VALIDATION FAILED:', failed, file=sys.stderr)
              sys.exit(1)
          print(f'Validated {len(reports)} committed report(s).')
          "
